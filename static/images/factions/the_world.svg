<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="worldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#701a75" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#18051a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="shadowWorld" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Outer Shield -->
  <path d="M50 4 C80 4 92 16 92 40 C92 72 50 96 50 96 C50 96 8 72 8 40 C8 16 20 4 50 4 Z" 
        fill="url(#worldGlow)" stroke="url(#goldTrim)" stroke-width="3" filter="url(#shadowWorld)"/>
  <path d="M50 9 C75 9 85 19 85 40 C85 68 50 89 50 89 C50 89 15 68 15 40 C15 19 25 9 50 9 Z" 
        fill="none" stroke="#a21caf" stroke-width="1" opacity="0.6"/>
  <!-- The World Globe / Rose Emblem -->
  <g stroke="url(#goldTrim)" stroke-width="1.8" fill="none" filter="url(#shadowWorld)">
    <!-- Globe Ring -->
    <circle cx="50" cy="46" r="22"/>
    <!-- Latitude lines -->
    <ellipse cx="50" cy="46" rx="22" ry="9"/>
    <!-- Longitude lines -->
    <ellipse cx="50" cy="46" rx="10" ry="22"/>
    <line x1="50" y1="24" x2="50" y2="68"/>
    <line x1="28" y1="46" x2="72" y2="46"/>
  </g>
  <!-- Crown / Republic Crest on top -->
  <g fill="url(#goldTrim)">
    <polygon points="50,15 42,22 45,26 55,26 58,22"/>
    <circle cx="50" cy="14" r="2"/>
    <circle cx="42" cy="20" r="1.5"/>
    <circle cx="58" cy="20" r="1.5"/>
  </g>
  <!-- Golden Stars -->
  <g fill="url(#goldTrim)">
    <!-- Bottom ribbon scroll -->
    <path d="M28 72 Q50 67 72 72 Q50 78 28 72 Z" fill="#4a044e" stroke="url(#goldTrim)" stroke-width="1"/>
    <circle cx="34" cy="72" r="1.5"/>
    <circle cx="50" cy="72" r="2"/>
    <circle cx="66" cy="72" r="1.5"/>
  </g>
</svg>
