<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="woodShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#290e02"/>
      <stop offset="100%" stop-color="#140601"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="tavernShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Wooden Tavern Round Shield -->
  <circle cx="50" cy="50" r="46" fill="url(#woodShield)" stroke="url(#amberGold)" stroke-width="4" filter="url(#tavernShadow)"/>
  <!-- Iron rivets on shield rim -->
  <circle cx="50" cy="8" r="2.5" fill="#d97706"/>
  <circle cx="50" cy="92" r="2.5" fill="#d97706"/>
  <circle cx="8" cy="50" r="2.5" fill="#d97706"/>
  <circle cx="92" cy="50" r="2.5" fill="#d97706"/>
  <circle cx="20" cy="20" r="2" fill="#b45309"/>
  <circle cx="80" cy="20" r="2" fill="#b45309"/>
  <circle cx="20" cy="80" r="2" fill="#b45309"/>
  <circle cx="80" cy="80" r="2" fill="#b45309"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="#78350f" stroke-dasharray="3,3" stroke-width="1.5"/>
  <!-- Foaming Tankard / Beer Mug -->
  <g filter="url(#tavernShadow)">
    <!-- Mug Body (Wooden Barrel Mug) -->
    <path d="M33 42 L31 76 C31 80 34 82 40 82 L60 82 C66 82 69 80 69 76 L67 42 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <!-- Mug Iron Hoops -->
    <path d="M32 49 C42 51 58 51 68 49 M31 66 C42 68 58 68 69 66" stroke="#451a03" stroke-width="3" fill="none"/>
    <!-- Mug Handle -->
    <path d="M67 48 C77 48 80 56 79 64 C78 72 73 75 68 74" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <path d="M67 48 C77 48 80 56 79 64 C78 72 73 75 68 74" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <!-- Foaming Top (Froth overflowing) -->
    <path d="M28 42 C28 35 34 32 40 34 C44 28 56 28 60 34 C66 32 72 35 72 42 C72 46 68 48 64 47 C60 49 56 47 50 48 C44 47 40 49 36 47 C32 48 28 46 28 42 Z" 
          fill="url(#foamGrad)" stroke="#d97706" stroke-width="1.5"/>
    <!-- Foam Drips -->
    <path d="M36 47 C36 54 40 55 40 48 M54 47 C54 56 58 56 58 48" fill="url(#foamGrad)" stroke="#d97706" stroke-width="1"/>
    <!-- Sparkles / bubbles -->
    <circle cx="38" cy="26" r="2.5" fill="#fef3c7" opacity="0.8"/>
    <circle cx="62" cy="24" r="2" fill="#fef3c7" opacity="0.8"/>
    <circle cx="50" cy="22" r="3" fill="#fef3c7" opacity="0.9"/>
  </g>
</svg>
