<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="grayGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadowGray" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Outer Shield -->
  <path d="M50 4 C80 4 92 16 92 40 C92 72 50 96 50 96 C50 96 8 72 8 40 C8 16 20 4 50 4 Z" 
        fill="url(#grayGlow)" stroke="url(#silverTrim)" stroke-width="3" filter="url(#shadowGray)"/>
  <path d="M50 9 C75 9 85 19 85 40 C85 68 50 89 50 89 C50 89 15 68 15 40 C15 19 25 9 50 9 Z" 
        fill="none" stroke="#64748b" stroke-width="1" opacity="0.6"/>
  <!-- Neutral Home / Shield Motif (Minimalist & Sleek) -->
  <g stroke="url(#silverTrim)" stroke-width="2" fill="none" filter="url(#shadowGray)">
    <!-- Cozy Hearth / Home crest outline -->
    <path d="M34 50 L50 34 L66 50"/>
    <path d="M38 48 L38 68 L62 68 L62 48"/>
    <!-- Central gentle flame / hearth spark -->
    <path d="M50 62 C46 62 45 58 48 54 C50 50 50 46 50 46 C50 46 54 52 53 56 C52 58 52 62 50 62 Z" fill="#94a3b8" stroke="none"/>
    <!-- Horizontal balance line -->
    <line x1="28" y1="74" x2="72" y2="74" stroke-width="1.5"/>
  </g>
</svg>
