    <!-- Face details -->
    <!-- Eyes -->
    <path d="M41 48 L46 50 L42 52 Z M59 48 L58 52 L54 50 Z" fill="#1e293b"/>
    <!-- Nose & Muzzle -->
    <polygon points="50,56 46,52 54,52" fill="#1e293b"/>
    <path d="M46 54 C46 57 48 59 50 59 C52 59 54 57 54 54" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <path d="M50 59 L50 64 M45 62 L55 62" stroke="#1e293b" stroke-width="1.5"/>
