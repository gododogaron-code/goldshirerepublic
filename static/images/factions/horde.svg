<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="hordeRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="ironEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="50%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <radialGradient id="hordeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180404"/>
    </radialGradient>
    <filter id="hordeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Tribal Shield Backing -->
  <path d="M50 4 L88 20 L80 65 L50 96 L20 65 L12 20 Z" 
        fill="url(#hordeBg)" stroke="url(#ironEdge)" stroke-width="4" filter="url(#hordeShadow)"/>
  <!-- Inner Shield Trim -->
  <path d="M50 11 L80 24 L73 61 L50 87 L27 61 L20 24 Z" 
        fill="none" stroke="#991b1b" stroke-width="1.5" opacity="0.6"/>
  <!-- Horde Sigil -->
  <g fill="url(#hordeRed)" stroke="#450a0a" stroke-width="1" filter="url(#hordeShadow)">
    <!-- Top Spikes -->
    <path d="M50 18 L46 28 L54 28 Z"/>
    <path d="M36 21 L35 32 L41 30 Z"/>
    <path d="M64 21 L59 30 L65 32 Z"/>
    <!-- Central Ring & Arc -->
    <path d="M50 32 C41 32 34 38 34 46 C34 50 36 54 39 57 L35 73 L43 62 C45 63 47 64 50 64 C53 64 55 63 57 62 L65 73 L61 57 C64 54 66 50 66 46 C66 38 59 32 50 32 Z M50 40 C54 40 57 43 57 47 C57 51 54 54 50 54 C46 54 43 51 43 47 C43 43 46 40 50 40 Z"/>
    <!-- Outer Curved Horns -->
    <path d="M26 38 C23 45 23 54 27 60 C25 55 26 47 30 43 L26 38 Z"/>
    <path d="M74 38 L70 43 C74 47 75 55 73 60 C77 54 77 45 74 38 Z"/>
    <!-- Bottom Tail Spikes -->
    <path d="M47 66 L50 78 L53 66 Z"/>
  </g>
</svg>
